[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiget"
version = "0.1.0"
description = "Runtime tooling for Getting Over It RL experiments on Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "mss>=10.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
rl = [
    "stable-baselines3>=2.7",
]
game-worker = [
    "UnityPy>=1.25,<2",
]

[project.scripts]
aiget-live-position = "aiget.game.probing.live_position:main"
aiget-memory-probe = "aiget.game.probing.memory_probe:main"
aiget-observation-schema = "aiget.rl.observation_schema:main"
aiget-observation-state = "aiget.game.probing.observation_state:main"
aiget-benchmark-observation = "aiget.rl.tools.benchmark_observation:main"
aiget-check-env = "aiget.rl.tools.check_env:main"
aiget-random-rollout = "aiget.rl.tools.random_rollout:main"
aiget-debug-reward-signal = "aiget.rl.tools.debug_reward_signal:main"
aiget-test-reset = "aiget.rl.tools.test_reset:main"
aiget-collect-reset-screens = "aiget.game.tools.collect_reset_screens:main"
aiget-annotate-reset-screen = "aiget.game.tools.annotate_reset_screen:main"
aiget-train-sac = "aiget.rl.tools.train_sac:main"
aiget-ptrace-il2cpp = "aiget.game.probing.ptrace_il2cpp:main"
aiget-physics-worker = "aiget.game.worker.physics_worker:main"
aiget-verify-physics-worker = "aiget.game.worker.verify_physics_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
